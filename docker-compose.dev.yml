services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      DJANGO_RUNSERVER: "true"
    entrypoint: ["sh", "./entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: npx ng serve --host 0.0.0.0 --poll 2000
