<div class="container section">
  <div class="profile-header animate-fade-up">
    <h1>Paramètres de mon Profil</h1>
    <p>Gérez vos informations personnelles et professionnelles</p>
  </div>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <p>Synchronisation de vos données...</p>
  </div>

  <div *ngIf="!isLoading" class="profile-card card glass-panel animate-fade-up">
    <div *ngIf="successMessage" class="alert alert-success animate-fade-in">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger animate-fade-in">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()" #profileForm="ngForm" class="profile-form">
      <h3><fa-icon [icon]="faUser"></fa-icon> Informations personnelles</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="first_name">Prénom</label>
          <input type="text" id="first_name" name="first_name" [(ngModel)]="profileData.first_name" required>
        </div>

        <div class="form-group">
          <label for="last_name">Nom</label>
          <input type="text" id="last_name" name="last_name" [(ngModel)]="profileData.last_name" required>
        </div>

        <div class="form-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" [(ngModel)]="profileData.email" required disabled class="disabled">
          <small><fa-icon [icon]="faLock"></fa-icon> Votre email ne peut pas être modifié pour des raisons de sécurité.</small>
        </div>

        <div class="form-group">
          <label for="phone">Numéro de téléphone</label>
          <input type="text" id="phone" name="phone" [(ngModel)]="profileData.phone">
        </div>

        <div class="form-group">
          <label for="city">Ville de résidence</label>
          <input type="text" id="city" name="city" [(ngModel)]="profileData.city">
        </div>
      </div>

      <div *ngIf="profileData.role === 'PROVIDER'" class="animate-fade-up">
        <hr>
        <h3><fa-icon [icon]="faToolbox"></fa-icon> Expertise professionnelle</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="business_name">Nom commercial / Garage</label>
            <input type="text" id="business_name" name="business_name" [(ngModel)]="profileData.provider_profile.business_name" required>
          </div>

          <div class="form-group">
            <label for="specialty">Type d'expertise</label>
            <select id="specialty" name="specialty" [(ngModel)]="profileData.provider_profile.specialty" required>
              <option value="MECANICIEN">Mécanicien</option>
              <option value="DEPANNAGE">Dépannage / Remorquage</option>
              <option value="GARAGE">Garage complet</option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience_years">Expérience (années)</label>
            <input type="number" id="experience_years" name="experience_years" [(ngModel)]="profileData.provider_profile.experience_years" min="0">
          </div>

          <div class="form-group">
            <label for="price_rate">Tarif horaire moyen (Ar)</label>
            <input type="number" id="price_rate" name="price_rate" [(ngModel)]="profileData.provider_profile.price_rate" min="0">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="address">Adresse exacte de l'atelier / garage</label>
          <input type="text" id="address" name="address" [(ngModel)]="profileData.provider_profile.address">
        </div>

        <div class="form-group full-width">
          <label for="bio">Présentation professionnelle (Bio)</label>
          <textarea id="bio" name="bio" [(ngModel)]="profileData.provider_profile.bio" rows="5" placeholder="Décrivez vos compétences..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary shadow-hover" [disabled]="!profileForm.form.valid || isSaving">
          <fa-icon *ngIf="isSaving" [icon]="faSpinner" [spin]="true"></fa-icon>
          {{ isSaving ? 'Mise à jour...' : 'Sauvegarder les changements' }}
        </button>
      </div>
    </form>
  </div>
</div>
