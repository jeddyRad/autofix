<div class="container section">
  <div class="profile-header">
    <h1 class="section-title">Mon Profil</h1>
    <p>Consultez et mettez à jour vos informations personnelles.</p>
  </div>

  <div *ngIf="isLoading" class="loading">
    Chargement de votre profil...
  </div>

  <div *ngIf="!isLoading" class="profile-card card">
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()" #profileForm="ngForm" class="profile-form">
      <h3>Informations générales</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="first_name">Prénom</label>
          <input type="text" id="first_name" name="first_name" [(ngModel)]="profileData.first_name" required class="form-control">
        </div>

        <div class="form-group">
          <label for="last_name">Nom</label>
          <input type="text" id="last_name" name="last_name" [(ngModel)]="profileData.last_name" required class="form-control">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="profileData.email" required disabled class="form-control disabled">
          <small>L'email ne peut pas être modifié.</small>
        </div>

        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input type="text" id="phone" name="phone" [(ngModel)]="profileData.phone" class="form-control">
        </div>

        <div class="form-group">
          <label for="city">Ville</label>
          <input type="text" id="city" name="city" [(ngModel)]="profileData.city" class="form-control">
        </div>
      </div>

      <div *ngIf="profileData.role === 'PROVIDER'">
        <hr>
        <h3>Informations professionnelles</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="business_name">Nom de l'entreprise</label>
            <input type="text" id="business_name" name="business_name" [(ngModel)]="profileData.provider_profile.business_name" required class="form-control">
          </div>

          <div class="form-group">
            <label for="specialty">Spécialité</label>
            <select id="specialty" name="specialty" [(ngModel)]="profileData.provider_profile.specialty" required class="form-control">
              <option value="MECANIC">Mécanicien</option>
              <option value="ELECTRIC">Électricien Auto</option>
              <option value="TOWING">Remorquage</option>
              <option value="BODYWORK">Carrossier</option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience_years">Années d'expérience</label>
            <input type="number" id="experience_years" name="experience_years" [(ngModel)]="profileData.provider_profile.experience_years" class="form-control" min="0">
          </div>

          <div class="form-group">
            <label for="price_rate">Tarif horaire (€)</label>
            <input type="number" id="price_rate" name="price_rate" [(ngModel)]="profileData.provider_profile.price_rate" class="form-control" min="0" step="0.01">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="address">Adresse professionnelle</label>
          <input type="text" id="address" name="address" [(ngModel)]="profileData.provider_profile.address" class="form-control">
        </div>

        <div class="form-group full-width">
          <label for="bio">À propos de moi (Bio)</label>
          <textarea id="bio" name="bio" [(ngModel)]="profileData.provider_profile.bio" rows="4" class="form-control"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!profileForm.form.valid || isSaving">
          {{ isSaving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
