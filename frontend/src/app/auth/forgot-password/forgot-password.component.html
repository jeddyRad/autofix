<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Mot de passe oublié</h2>
      <p>Entrez votre email pour réinitialiser votre mot de passe</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-banner" style="background: #e8f5e9; color: #2e7d32; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
      {{ successMessage }}
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="votre@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        {{ isLoading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Je me souviens de mon mot de passe ! <a routerLink="/login">Se connecter</a></p>
      <a routerLink="/" class="back-link">← Retour à l'accueil</a>
    </div>
  </div>
</div>
