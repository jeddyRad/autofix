<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Connexion</h2>
      <p>Content de vous revoir sur AutoFixMG</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="votre@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
        <div style="text-align: right; margin-top: 0.5rem;">
          <a routerLink="/forgot-password" style="font-size: 0.9rem;">Mot de passe oublié ?</a>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>
    <div class="auth-footer">
      <p>Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
      <a routerLink="/" class="back-link">← Retour à l'accueil</a>
    </div>
  </div>
</div>
