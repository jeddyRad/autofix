<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Nouveau mot de passe</h2>
      <p>Entrez votre nouveau mot de passe</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-banner" style="background:#e8f5e9;color:#2e7d32;padding:1rem;border-radius:4px;margin-bottom:1rem;">
      {{ successMessage }}
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" *ngIf="!successMessage && uid && token">
      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        {{ isLoading ? 'Réinitialisation...' : 'Valider' }}
      </button>
    </form>

    <div *ngIf="!uid || !token" style="text-align:center;color:var(--text-muted);margin-top:1rem;">
      <p>Lien invalide. Veuillez utiliser le lien complet depuis le terminal.</p>
      <a routerLink="/forgot-password">Demander un nouveau lien</a>
    </div>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">← Retour à la connexion</a>
    </div>
  </div>
</div>
