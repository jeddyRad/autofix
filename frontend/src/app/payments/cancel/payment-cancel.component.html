<div class="payment-page">
  <div class="payment-card">
    <div class="cancel-icon"><fa-icon [icon]="faTimesCircle"></fa-icon></div>
    <h2>Paiement annulé</h2>
    <p>Le paiement n'a pas été finalisé. Votre rendez-vous reste disponible dans votre tableau de bord.</p>
    <div class="payment-actions">
      <button class="btn btn-primary" routerLink="/dashboard">Retour au tableau de bord</button>
      <button class="btn btn-outline" routerLink="/providers">Trouver un prestataire</button>
    </div>
  </div>
</div>
